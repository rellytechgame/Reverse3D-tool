name: Bug report
description: Report a reproducible problem
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Security vulnerabilities must NOT be reported here.** See SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Command or tool call, expected vs actual result.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      render: shell
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `reverse3d --json doctor`
      description: Remove any path or information you consider private.
      render: json
  - type: input
    id: os
    attributes:
      label: OS / Python version
