name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"  # weekly: catch newly published CVEs in dependencies

# Least privilege by default; jobs elevate only what they need.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Third-party actions are pinned to full commit SHAs (supply-chain control).
# Dependabot (.github/dependabot.yml) keeps the pins up to date.

jobs:
  lint:
    name: Lint & types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff format --check reverse3d tests
      - run: ruff check reverse3d tests
      - run: mypy reverse3d
      - name: Lint installers
        run: |
          bash -n scripts/install.sh
          shellcheck scripts/install.sh

  installer:
    name: Installer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install from this checkout (bash)
        if: runner.os != 'Windows'
        run: |
          bash scripts/install.sh --source . --minimal --no-setup
          ~/.reverse3d/venv/bin/reverse3d --json doctor
          ~/.reverse3d/venv/bin/reverse3d --json setup --dry-run
          bash scripts/install.sh --uninstall
          test ! -d ~/.reverse3d/venv
      - name: Install from this checkout (PowerShell)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/install.ps1 -Source . -Minimal -NoSetup -NoPath
          & "$env:USERPROFILE\.reverse3d\venv\Scripts\reverse3d.exe" --json doctor
          & "$env:USERPROFILE\.reverse3d\venv\Scripts\reverse3d.exe" --json setup --dry-run
          ./scripts/install.ps1 -Uninstall
          if (Test-Path "$env:USERPROFILE\.reverse3d\venv") { exit 1 }

  test:
    name: Tests (py${{ matrix.python }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Tool schemas are in sync with the code
        run: |
          reverse3d agent tools --format anthropic -o docs/tools/anthropic.json
          reverse3d agent tools --format openai -o docs/tools/openai.json
          reverse3d agent tools --format gemini -o docs/tools/gemini.json
          git diff --exit-code docs/tools
      - run: pytest --cov=reverse3d --cov-report=term --cov-fail-under=70

  security:
    name: Security (SAST, SCA, secrets, SBOM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]" cyclonedx-bom
      - name: SAST (bandit)
        run: bandit -c pyproject.toml -r reverse3d
      - name: SCA (pip-audit)
        run: pip-audit --skip-editable --strict
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Organisation-owned repositories need a (free) license key.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
      - name: SBOM (CycloneDX)
        run: cyclonedx-py environment --output-format JSON -o sbom.cdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom
          path: sbom.cdx.json
          retention-days: 90

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@51f77329afa6477de8c49fc9c7046c15b9a4e79d # v3.29.5
        with:
          languages: python
          queries: security-extended
      - uses: github/codeql-action/analyze@51f77329afa6477de8c49fc9c7046c15b9a4e79d # v3.29.5
